<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel da esteira — fora do ar</title>
  <style>
    :root { color-scheme: light dark; --fundo: #fcfcfb; --texto: #0b0b0b; --texto-2: #4b4a45; }
    @media (prefers-color-scheme: dark) { :root { --fundo: #1a1a19; --texto: #f0efec; --texto-2: #c9c7c0; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--texto);
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 34rem; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: var(--texto-2); line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
<main>
  <h1>Este endereço não está mais no ar</h1>
  <p>A versão para avaliação do painel da esteira de inovação da FACEPE ficou disponível por um período limitado.
    Se você precisa consultá-la de novo, fale com quem enviou o link.</p>
</main>
</body>
</html>
